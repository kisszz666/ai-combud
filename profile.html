<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 - 智能电脑配置生成系统</title>
<style>
/* ============================================================
   GLOBAL — 锐利硬核赛博科技风 (与主页统一)
   ============================================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #0D0D18;
  --bg-panel:  #0F0F1F;
  --bg-input:  #080814;
  --bg-hover:  rgba(123,47,253,0.04);
  --purple:    #7B2FFD;
  --purple-b:  #5B21B6;
  --green:     #00FFA3;
  --green-dim: #00C870;
  --text:      #E2DCF0;
  --text-dim:  #8A82A8;
  --text-weak: #5A5470;
  --border:    #2A2240;
  --border-hi: #4A3A6A;
  --font:      'Inter','JetBrains Mono','PingFang SC','Microsoft YaHei',monospace;
  --tf:        0.16s ease;
  --c1: #FF6B5B; --c2: #FF9A40; --c3: #FFD84D; --c4: #00FFA3; --c5: #40C8FF; --c6: #7B2FFD;
}
html { font-size:16px; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; position:relative; overflow-x:hidden; }

body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background: linear-gradient(rgba(123,47,253,0.045) 1px, transparent 1px),
              linear-gradient(90deg, rgba(123,47,253,0.045) 1px, transparent 1px);
  background-size:40px 40px; }
body::after { content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background: linear-gradient(135deg, rgba(123,47,253,0.07) 0%, transparent 25%),
              linear-gradient(315deg, rgba(0,255,163,0.03) 0%, transparent 30%),
              repeating-linear-gradient(45deg, transparent, transparent 180px, rgba(123,47,253,0.015) 180px, rgba(123,47,253,0.015) 182px); }

/* ============================================================
   底层背景 — 波浪渐变 + 升腾粒子
   ============================================================ */
.bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg-layer .bg-waves { position:absolute; width:200%; height:100%; left:0; top:0; will-change:transform; }
.bg-layer .bg-waves.w2 { top:35px; opacity:0.55; }
.bg-layer .bg-waves.w3 { top:-25px; opacity:0.35; }

/* 粒子 */
.bg-particle { position:absolute; border-radius:50%; pointer-events:none;
  animation:particleRise linear forwards; box-shadow:0 0 6px currentColor; }
@keyframes particleRise {
  0%   { transform:translateY(0) scale(1);   opacity:0.9; }
  30%  { opacity:0.6; }
  100% { transform:translateY(-420px) scale(0.15); opacity:0; }
}

/* ============================================================
   SHELL
   ============================================================ */
.console { position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh; }

/* 顶部通栏 */
.topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:2px solid var(--border); position:relative; flex-wrap:wrap; gap:10px; }
.topbar::after { content:''; position:absolute; bottom:-2px; left:0; width:200px; height:2px; background:linear-gradient(90deg,var(--green),var(--purple)); }
.tb-left h1 { font-size:1.55rem; font-weight:800; letter-spacing:2px; background:linear-gradient(135deg,#C8B8FF 0%,var(--purple) 45%,var(--green) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1.15; }
.tb-left .sub { font-size:0.7rem; color:var(--text-dim); letter-spacing:3px; text-transform:uppercase; }
.tb-right { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.tb-stat { text-align:center; }
.tb-stat .val { font-size:0.9rem; font-weight:700; color:var(--green); letter-spacing:1px; }
.tb-stat .lbl { font-size:0.62rem; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; }

/* 导航按钮 */
.nav-btns { display:flex; gap:0; margin-right:16px; }
.nav-btn { padding:10px 24px; font-size:0.82rem; font-weight:700; letter-spacing:2px; cursor:pointer; font-family:var(--font); text-decoration:none; background:var(--bg-input); border:1px solid var(--border); color:var(--text-dim); transition:all var(--tf); position:relative; }
.nav-btn:first-child { border-radius:4px 0 0 4px; }
.nav-btn:last-child { border-radius:0 4px 4px 0; }
.nav-btn:hover { border-color:var(--purple); color:var(--text); }
.nav-btn.active { border-color:var(--green); color:#fff; background:rgba(0,255,163,0.06); box-shadow:inset 0 0 0 1px var(--green); z-index:1; }
.nav-btn.active::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--green); box-shadow:0 0 8px var(--green); }

/* ============================================================
   主体
   ============================================================ */
.main-area { flex:1; padding:16px 32px 32px; max-width:960px; margin:0 auto; width:100%; }

/* 面板 */
.panel { background:var(--bg-panel); border:1px solid var(--border); position:relative; margin-bottom:20px; }
.panel::before { content:''; position:absolute; top:-1px; left:-1px; width:16px; height:16px; border-top:2px solid var(--purple); border-left:2px solid var(--purple); }
.panel::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:16px; height:16px; border-bottom:2px solid var(--purple); border-right:2px solid var(--purple); }
.panel-hd { display:flex; align-items:center; gap:8px; padding:14px 18px 10px; border-bottom:1px solid var(--border); }
.panel-hd::before { content:''; width:3px; height:14px; background:var(--green); box-shadow:0 0 6px var(--green); }
.panel-hd span { font-size:0.72rem; font-weight:800; letter-spacing:3px; color:var(--text-dim); text-transform:uppercase; }
.panel-bd { padding:14px 18px; }

/* ============================================================
   个人信息头部
   ============================================================ */
.profile-header { display:flex; align-items:center; gap:20px; padding:4px 0; flex-wrap:wrap; }
.avatar-wrap { position:relative; flex-shrink:0; }
.avatar-img { width:80px; height:80px; border-radius:6px; object-fit:cover; border:2px solid var(--purple); background:linear-gradient(135deg,var(--purple-b),var(--purple)); display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:800; color:#fff; cursor:pointer; transition:all var(--tf); overflow:hidden; }
.avatar-img:hover { border-color:var(--green); box-shadow:0 0 16px rgba(123,47,253,0.4); }
.avatar-img img { width:100%; height:100%; object-fit:cover; }
.avatar-upload { position:absolute; bottom:-4px; right:-4px; width:28px; height:28px; background:var(--purple); border:1px solid var(--border-hi); border-radius:4px; cursor:pointer; font-size:0.75rem; display:flex; align-items:center; justify-content:center; color:#fff; transition:all var(--tf); }
.avatar-upload:hover { background:var(--green); color:#000; }
.profile-info { flex:1; min-width:200px; }
.profile-info .pi-name { font-size:1.2rem; font-weight:700; color:#fff; letter-spacing:1px; display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.profile-info .pi-name .btn-edit-nick { font-size:0.65rem; padding:4px 10px; background:var(--bg-input); border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font-family:var(--font); letter-spacing:1px; transition:all var(--tf); }
.profile-info .pi-name .btn-edit-nick:hover { border-color:var(--purple); color:var(--text); }
.profile-info .pi-meta { font-size:0.7rem; color:var(--text-dim); letter-spacing:2px; }
.profile-info .pi-meta span { color:var(--green); margin:0 6px; }
.profile-actions { display:flex; gap:10px; flex-shrink:0; }
.btn-logout { padding:8px 20px; background:transparent; border:1px solid var(--c1); color:var(--c1); font-size:0.74rem; font-weight:600; cursor:pointer; font-family:var(--font); letter-spacing:2px; transition:all var(--tf); }
.btn-logout:hover { background:rgba(255,107,91,0.1); box-shadow:0 0 10px rgba(255,107,91,0.2); }

/* ============================================================
   标签切换栏
   ============================================================ */
.tab-bar { display:flex; gap:0; margin-bottom:16px; }
.tab-btn { padding:10px 28px; font-size:0.78rem; font-weight:700; letter-spacing:2px; cursor:pointer; font-family:var(--font); background:var(--bg-input); border:1px solid var(--border); color:var(--text-dim); transition:all var(--tf); position:relative; }
.tab-btn:first-child { border-radius:4px 0 0 4px; }
.tab-btn:last-child { border-radius:0 4px 4px 0; }
.tab-btn:hover { border-color:var(--purple); color:var(--text); }
.tab-btn.active { border-color:var(--green); color:#fff; background:rgba(0,255,163,0.06); box-shadow:inset 0 0 0 1px var(--green); z-index:1; }
.tab-btn.active::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--green); box-shadow:0 0 8px var(--green); }

.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* ============================================================
   收藏 / 历史列表项
   ============================================================ */
.config-card { background:var(--bg-input); border:1px solid var(--border); margin-bottom:10px; transition:all var(--tf); }
.config-card:hover { border-color:var(--border-hi); }
.config-card .cc-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; cursor:pointer; transition:background var(--tf); flex-wrap:wrap; gap:8px; }
.config-card .cc-header:hover { background:var(--bg-hover); }
.cc-header .cc-summary { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.cc-header .cc-s-item { font-size:0.82rem; letter-spacing:1px; }
.cc-header .cc-s-budget { font-weight:700; color:var(--green); }
.cc-header .cc-s-scene { color:var(--text); }
.cc-header .cc-s-total { font-weight:700; color:var(--c3); }
.cc-header .cc-s-time { font-size:0.68rem; color:var(--text-weak); }
.cc-header .cc-actions { display:flex; gap:8px; align-items:center; }
.cc-header .cc-expand { font-size:0.65rem; color:var(--text-weak); letter-spacing:2px; transition:transform var(--tf); }
.cc-header .cc-expand.open { transform:rotate(90deg); }

.cc-detail { display:none; padding:0 16px 16px; border-top:1px solid var(--border); }
.cc-detail.show { display:block; }

/* 小按钮 */
.btn-sm { padding:6px 14px; font-size:0.68rem; font-weight:700; letter-spacing:1px; cursor:pointer; font-family:var(--font); background:var(--bg-input); border:1px solid var(--border); color:var(--text-dim); transition:all var(--tf); }
.btn-sm:hover { border-color:var(--purple); color:var(--text); }
.btn-sm.danger { border-color:rgba(255,107,91,0.4); color:var(--c1); }
.btn-sm.danger:hover { background:rgba(255,107,91,0.1); }
.btn-sm.gold { border-color:rgba(255,216,77,0.4); color:var(--c3); }
.btn-sm.gold:hover { background:rgba(255,216,77,0.08); }

/* 配件简表 */
.mini-config-table { width:100%; border-collapse:collapse; margin-top:12px; font-size:0.78rem; }
.mini-config-table th,
.mini-config-table td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--border); }
.mini-config-table th { color:var(--text-dim); font-size:0.65rem; letter-spacing:2px; font-weight:600; }
.mini-config-table td { color:var(--text); }
.mini-config-table .mct-price { color:var(--green); font-weight:600; }

/* 性能条 */
.perf-bars { display:flex; gap:20px; margin-top:10px; flex-wrap:wrap; }
.perf-bar-item { flex:1; min-width:100px; }
.perf-bar-item .pb-label { font-size:0.62rem; color:var(--text-dim); letter-spacing:2px; margin-bottom:3px; }
.perf-bar-item .pb-track { height:4px; background:var(--bg); }
.perf-bar-item .pb-fill { height:100%; background:linear-gradient(90deg,var(--purple),var(--green)); transition:width 0.3s ease; }

/* ============================================================
   社区互动
   ============================================================ */
.warning-banner { text-align:center; padding:8px 16px; margin-bottom:14px; font-size:0.62rem; color:var(--c2); letter-spacing:1px; border:1px solid rgba(255,154,64,0.2); background:rgba(255,154,64,0.05); }

.interact-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; margin-bottom:6px; background:var(--bg-input); border:1px solid var(--border); transition:all var(--tf); flex-wrap:wrap; gap:8px; }
.interact-item:hover { border-color:var(--border-hi); }
.interact-item .ii-info { flex:1; min-width:0; }
.interact-item .ii-title { font-size:0.82rem; color:var(--text); letter-spacing:1px; cursor:pointer; transition:color var(--tf); }
.interact-item .ii-title:hover { color:var(--green); }
.interact-item .ii-meta { font-size:0.65rem; color:var(--text-weak); letter-spacing:1px; margin-top:3px; }
.interact-item .ii-comment { font-size:0.78rem; color:var(--text-dim); margin-top:4px; line-height:1.5; }
.interact-item .ii-actions { display:flex; gap:6px; flex-shrink:0; }

.edit-comment-area { display:none; margin-top:6px; }
.edit-comment-area.show { display:flex; gap:8px; }
.edit-comment-area input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; font-family:var(--font); font-size:0.78rem; }
.edit-comment-area input:focus { outline:none; border-color:var(--green); }

/* ============================================================
   登录弹窗
   ============================================================ */
.modal-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.82); justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:var(--bg-panel); border:1px solid var(--border); position:relative; width:420px; max-width:94vw; }
.modal-box::before { content:''; position:absolute; top:-1px; left:-1px; width:16px; height:16px; border-top:2px solid var(--purple); border-left:2px solid var(--purple); }
.modal-box::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:16px; height:16px; border-bottom:2px solid var(--purple); border-right:2px solid var(--purple); }
.modal-hd { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 10px; border-bottom:1px solid var(--border); }
.modal-hd span { font-size:0.78rem; font-weight:800; letter-spacing:3px; color:var(--text-dim); }
.modal-close { background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer; transition:color var(--tf); }
.modal-close:hover { color:var(--c1); }
.modal-bd { padding:20px; }
.modal-bd .form-row { margin-bottom:16px; }
.modal-bd .form-row label { display:block; margin-bottom:5px; font-size:0.68rem; color:var(--text-dim); letter-spacing:2px; }
.modal-bd .form-row input { width:100%; padding:10px 14px; background:var(--bg-input); border:1px solid var(--border); color:var(--text); font-size:0.88rem; font-family:var(--font); letter-spacing:1px; transition:border-color var(--tf); }
.modal-bd .form-row input:focus { outline:none; border-color:var(--purple); }
.modal-error { color:var(--c1); font-size:0.7rem; letter-spacing:1px; margin-bottom:12px; min-height:18px; }
.modal-btns { display:flex; gap:10px; }
.btn-auth { flex:1; padding:11px 0; font-size:0.82rem; font-weight:700; letter-spacing:2px; cursor:pointer; font-family:var(--font); border:none; transition:all var(--tf); }
.btn-auth.login { background:linear-gradient(135deg,var(--purple),var(--purple-b)); color:#fff; }
.btn-auth.login:hover { box-shadow:0 0 16px rgba(123,47,253,0.4); }
.btn-auth.register { background:transparent; border:1px solid var(--green); color:var(--green); }
.btn-auth.register:hover { background:rgba(0,255,163,0.06); }

/* ============================================================
   昵称编辑弹窗 (小型)
   ============================================================ */
.nickname-edit-row { display:none; align-items:center; gap:8px; }
.nickname-edit-row.show { display:flex; }
.nickname-edit-row input { background:var(--bg-input); border:1px solid var(--border); color:var(--text); padding:6px 10px; font-family:var(--font); font-size:0.95rem; letter-spacing:1px; width:160px; }
.nickname-edit-row input:focus { outline:none; border-color:var(--green); }

/* ============================================================
   空状态
   ============================================================ */
.empty-state { text-align:center; padding:40px 20px; }
.empty-state .empty-icon { font-size:2.5rem; margin-bottom:12px; }
.empty-state .empty-text { font-size:0.78rem; color:var(--text-dim); letter-spacing:2px; }

/* ============================================================
   底部
   ============================================================ */
.bottombar { display:flex; align-items:center; justify-content:space-between; padding:8px 32px; border-top:1px solid var(--border); font-size:0.62rem; color:var(--text-weak); letter-spacing:2px; margin-top:auto; }
.bottombar .bt-tags { display:flex; gap:14px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:768px) {
  .main-area { padding:10px 12px; }
  .topbar { padding:12px 16px; }
  .nav-btn { padding:8px 14px; font-size:0.7rem; letter-spacing:1px; }
  .profile-header { flex-direction:column; text-align:center; }
  .profile-actions { justify-content:center; }
  .tab-btn { padding:8px 16px; font-size:0.7rem; }
  .cc-header .cc-summary { gap:6px; }
}
</style>
</head>
<body>

<div class="bg-layer">
  <svg class="bg-waves w1" viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wg1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.12"/><stop offset="35%" stop-color="#00FFA3" stop-opacity="0.04"/>
        <stop offset="50%" stop-color="#7B2FFD" stop-opacity="0.03"/><stop offset="65%" stop-color="#7B2FFD" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#7B2FFD" stop-opacity="0.12"/>
      </linearGradient>
      <linearGradient id="wg2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00C870" stop-opacity="0.08"/><stop offset="40%" stop-color="#00FFA3" stop-opacity="0.03"/>
        <stop offset="60%" stop-color="#5B21B6" stop-opacity="0.03"/><stop offset="100%" stop-color="#7B2FFD" stop-opacity="0.08"/>
      </linearGradient>
    </defs>
    <path d="M0,280 C120,160 240,160 360,280 C480,400 600,400 720,280 C840,160 960,160 1080,280 C1200,400 1320,400 1440,280 L1440,620 C1320,740 1200,740 1080,620 C960,500 840,500 720,620 C600,740 480,740 360,620 C240,500 120,500 0,620 Z" fill="url(#wg1)"/>
    <path d="M0,360 C120,290 240,290 360,360 C480,430 600,430 720,360 C840,290 960,290 1080,360 C1200,430 1320,430 1440,360 L1440,510 C1320,580 1200,580 1080,510 C960,440 840,440 720,510 C600,580 480,580 360,510 C240,440 120,440 0,510 Z" fill="url(#wg2)"/>
  </svg>
  <svg class="bg-waves w2" viewBox="0 0 1440 900" preserveAspectRatio="none">
    <path d="M0,250 C120,150 240,150 360,250 C480,350 600,350 720,250 C840,150 960,150 1080,250 C1200,350 1320,350 1440,250 L1440,580 C1320,680 1200,680 1080,580 C960,480 840,480 720,580 C600,680 480,680 360,580 C240,480 120,480 0,580 Z" fill="url(#wg1)"/>
  </svg>
  <svg class="bg-waves w3" viewBox="0 0 1440 900" preserveAspectRatio="none">
    <path d="M0,310 C120,200 240,200 360,310 C480,420 600,420 720,310 C840,200 960,200 1080,310 C1200,420 1320,420 1440,310 L1440,570 C1320,680 1200,680 1080,570 C960,460 840,460 720,570 C600,680 480,680 360,570 C240,460 120,460 0,570 Z" fill="url(#wg1)"/>
  </svg>
  <div id="particlesContainer"></div>
</div>



<div class="console">

  <!-- ========== 顶部通栏 ========== -->
  <header class="topbar">
    <div class="tb-left">
      <h1>智能电脑配置生成系统</h1>
      <div class="sub">AI-Powered PC Configurator</div>
    </div>
    <div class="tb-right">
      <div class="nav-btns">
        <a href="index.html" class="nav-btn">⚡ 智能生成</a>
        <a href="community.html" class="nav-btn">💬 电脑社区</a>
        <a href="profile.html" class="nav-btn active">👤 个人主页</a>
      </div>
      <div class="tb-stat" id="loginStatus">
        <div class="val" style="color:var(--c2);">未登录</div>
        <div class="lbl">登录状态</div>
      </div>
    </div>
  </header>

  <!-- ========== 主体 ========== -->
  <div class="main-area" id="mainArea">

    <!-- 未登录提示 -->
    <div id="loginPrompt" style="display:none;">
      <div class="panel">
        <div class="panel-hd"><span>WELCOME · 欢迎</span></div>
        <div class="panel-bd" style="text-align:center;padding:40px 20px;">
          <div style="font-size:3rem;margin-bottom:16px;">👤</div>
          <div style="font-size:0.9rem;color:var(--text-dim);letter-spacing:2px;margin-bottom:20px;">请先登录以查看个人主页</div>
          <button class="btn-auth login" style="width:auto;padding:10px 40px;" onclick="showLoginModal()">🔑 登录 / 注册</button>
        </div>
      </div>
    </div>

    <!-- 已登录内容 -->
    <div id="loggedInContent" style="display:none;">

      <!-- 个人信息卡片 -->
      <div class="panel">
        <div class="panel-hd"><span>PROFILE · 个人信息</span></div>
        <div class="panel-bd">
          <div class="profile-header">
            <div class="avatar-wrap">
              <div class="avatar-img" id="avatarDisplay" onclick="document.getElementById('avatarInput').click()">
                <span id="avatarFallback">?</span>
              </div>
              <div class="avatar-upload" title="上传头像" onclick="document.getElementById('avatarInput').click()">📷</div>
              <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onchange="uploadAvatar(this)">
            </div>
            <div class="profile-info">
              <div class="pi-name">
                <span id="displayNickname">--</span>
                <div class="nickname-edit-row" id="nickEditRow">
                  <input type="text" id="nickInput" maxlength="20" placeholder="输入新昵称">
                  <button class="btn-sm" onclick="saveNickname()">保存</button>
                  <button class="btn-sm" onclick="cancelEditNick()">取消</button>

                <button class="btn-edit-nick" id="btnEditNick" onclick="startEditNick()">✏️ 编辑</button>

              <div class="pi-meta">

          <div class="tab-panel active" id="tab-favorites">
            <div id="favoritesList"></div>
          </div>

          <!-- 历史标签页 -->
          <div class="tab-panel" id="tab-history">
            <div id="historyList"></div>
          </div>

          <!-- 社区互动标签页 -->
          <div class="tab-panel" id="tab-community">
            <div class="warning-banner">⚠ 点赞/收藏/评论数据保存在浏览器本地，更换设备或清除浏览器缓存后数据将丢失</div>
            <div class="tab-bar" style="margin-bottom:12px;">
              <button class="tab-btn active" data-subtab="subtab-likes" onclick="switchSubTab('subtab-likes', this)">👍 点赞过的帖子</button>
              <button class="tab-btn" data-subtab="subtab-postfavs" onclick="switchSubTab('subtab-postfavs', this)">⭐ 收藏的帖子</button>
              <button class="tab-btn" data-subtab="subtab-comments" onclick="switchSubTab('subtab-comments', this)">💬 我的评论</button>
            </div>
            <div class="tab-panel active" id="subtab-likes"></div>
            <div class="tab-panel" id="subtab-postfavs"></div>
            <div class="tab-panel" id="subtab-comments"></div>
          </div>
        </div>

    </div><!-- /loggedInContent -->
  </div>

  <!-- ========== 底部 ========== -->
  <footer class="bottombar">
    <span>PROFILE ONLINE</span>
    <div class="bt-tags">
      <span>云端存储</span><span>数据隔离</span><span>AI引擎</span><span>实时同步</span>
    </div>
    <span>READY</span>
  </footer>

</div>

<!-- ========== 登录/注册弹窗 ========== -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-hd">
      <span id="modalTitle">🔑 登录</span>
      <button class="modal-close" onclick="hideLoginModal()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="form-row">
        <label>账号</label>
        <input type="text" id="loginAccount" placeholder="请输入账号 (3-20字符)" maxlength="20">
      </div>
      <div class="form-row">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码 (6位以上)" maxlength="30">
      </div>
      <div class="modal-error" id="modalError"></div>
      <div class="modal-btns">
        <button class="btn-auth login" id="btnLogin" onclick="doLogin()">登录</button>
        <button class="btn-auth register" id="btnRegister" onclick="doRegister()">注册</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 常量 ====================
const API_BASE = 'http://localhost:8000';

// ==================== Auth 工具函数 ====================
function getToken() { return localStorage.getItem('pc_token') || ''; }
function isLoggedIn() { return !!getToken(); }
function saveAuth(token, user) { localStorage.setItem('pc_token', token); localStorage.setItem('pc_user', JSON.stringify(user)); }
function clearAuth() { localStorage.removeItem('pc_token'); localStorage.removeItem('pc_user'); }
function getSavedUser() { try { return JSON.parse(localStorage.getItem('pc_user')); } catch(e) { return null; } }

async function apiGet(path) {
  const sep = path.includes('?') ? '&' : '?';
  const resp = await fetch(API_BASE + path + sep + 'token=' + encodeURIComponent(getToken()));
  if (resp.status === 401) { clearAuth(); showLoginPrompt(); throw new Error('未登录'); }
  return resp.json();
}
async function apiPost(path, body) {
  const resp = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, token: getToken() })
  });
  if (resp.status === 401) { clearAuth(); showLoginPrompt(); throw new Error('未登录'); }
  return resp.json();
}
async function apiPut(path, body) {
  const resp = await fetch(API_BASE + path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, token: getToken() })
  });
  if (resp.status === 401) { clearAuth(); showLoginPrompt(); throw new Error('未登录'); }
  return resp.json();
}
async function apiDelete(path) {
  const sep = path.includes('?') ? '&' : '?';
  const resp = await fetch(API_BASE + path + sep + 'token=' + encodeURIComponent(getToken()), { method: 'DELETE' });
  if (resp.status === 401) { clearAuth(); showLoginPrompt(); throw new Error('未登录'); }
  return resp.json();
}

// ==================== 页面状态 ====================
let currentUser = null;

// ==================== 初始化 ====================
function init() {
  if (isLoggedIn()) {
    loadProfile();
  } else {
    showLoginPrompt();
  }
}

function showLoginPrompt() {
  document.getElementById('loginPrompt').style.display = 'block';
  document.getElementById('loggedInContent').style.display = 'none';
  document.getElementById('loginStatus').innerHTML = '<div class="val" style="color:var(--c2);">未登录</div><div class="lbl">登录状态</div>';
}

function showLoggedIn() {
  document.getElementById('loginPrompt').style.display = 'none';
  document.getElementById('loggedInContent').style.display = 'block';
}

// ==================== 加载用户资料 ====================
async function loadProfile() {
  try {
    const data = await apiGet('/api/user/profile');
    if (data.success) {
      currentUser = data.user;
      saveAuth(getToken(), currentUser);
      renderProfileHeader();
      showLoggedIn();
      document.getElementById('loginStatus').innerHTML = '<div class="val">' + esc(currentUser.nickname || currentUser.account) + '</div><div class="lbl">已登录</div>';
      loadFavorites();
      loadHistory();
      loadCommunityData();
    }
  } catch (e) {
    showLoginPrompt();
  }
}

function renderProfileHeader() {
  if (!currentUser) return;
  document.getElementById('displayNickname').textContent = currentUser.nickname || currentUser.account;
  document.getElementById('displayUserId').textContent = currentUser.id;
  document.getElementById('displayCreatedAt').textContent = currentUser.created_at || '--';

  const avatarDisplay = document.getElementById('avatarDisplay');
  const fallback = document.getElementById('avatarFallback');
  if (currentUser.avatar_url) {
    avatarDisplay.innerHTML = '<img src="' + API_BASE + currentUser.avatar_url + '" alt="avatar" style="width:100%;height:100%;object-fit:cover;">';
  } else {
    avatarDisplay.innerHTML = '<span id="avatarFallback">' + esc((currentUser.nickname || currentUser.account)[0].toUpperCase()) + '</span>';
  }
}

// ==================== 头像上传 ====================
async function uploadAvatar(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  if (file.size > 2 * 1024 * 1024) { alert('头像文件不能超过 2MB'); return; }

  const formData = new FormData();
  formData.append('file', file);
  formData.append('token', getToken());

  try {
    const resp = await fetch(API_BASE + '/api/user/avatar', { method: 'POST', body: formData });
    if (resp.status === 401) { clearAuth(); showLoginPrompt(); return; }
    const data = await resp.json();
    if (data.success) {
      currentUser.avatar_url = data.avatar_url;
      saveAuth(getToken(), currentUser);
      renderProfileHeader();
    } else {
      alert('上传失败');
    }
  } catch (e) {
    alert('上传出错: ' + e.message);
  }
}

// ==================== 昵称编辑 ====================
function startEditNick() {
  document.getElementById('nickEditRow').classList.add('show');
  document.getElementById('btnEditNick').style.display = 'none';
  document.getElementById('nickInput').value = currentUser.nickname || currentUser.account || '';
  document.getElementById('nickInput').focus();
}

function cancelEditNick() {
  document.getElementById('nickEditRow').classList.remove('show');
  document.getElementById('btnEditNick').style.display = '';
}

async function saveNickname() {
  const nick = document.getElementById('nickInput').value.trim();
  if (!nick) { alert('昵称不能为空'); return; }
  if (nick.length > 20) { alert('昵称最多 20 个字符'); return; }
  try {
    const data = await apiPut('/api/user/profile', { nickname: nick });
    if (data.success) {
      currentUser = data.user;
      saveAuth(getToken(), currentUser);
      renderProfileHeader();
      cancelEditNick();
    }
  } catch (e) { alert('修改失败'); }
}

// ==================== 登出 ====================
async function doLogout() {
  try {
    await fetch(API_BASE + '/api/auth/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'token=' + encodeURIComponent(getToken())
    });
  } catch (e) {}
  clearAuth();
  currentUser = null;
  showLoginPrompt();
}

// ==================== 收藏列表 ====================
async function loadFavorites() {
  const el = document.getElementById('favoritesList');
  try {
    const data = await apiGet('/api/favorites');
    if (!data.success || !data.favorites || data.favorites.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">⭐</div><div class="empty-text">暂无收藏配置</div></div>';
      return;
    }
    el.innerHTML = data.favorites.map((f, i) => renderConfigCard(f, 'fav', i)).join('');
  } catch (e) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-text">加载失败</div></div>';
  }
}

// ==================== 历史列表 ====================
async function loadHistory() {
  const el = document.getElementById('historyList');
  try {
    const data = await apiGet('/api/history');
    if (!data.success || !data.history || data.history.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无生成记录</div></div>';
      return;
    }
    el.innerHTML = data.history.map((h, i) => renderConfigCard(h, 'hist', i)).join('');
  } catch (e) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-text">加载失败</div></div>';
  }
}

// ==================== 渲染配置卡片 ====================
function renderConfigCard(item, type, idx) {
  const configs = item.configs || [];
  const budget = item.budget || 0;
  const scenario = item.scenario || '';
  const total_price = item.total_price || 0;
  const time = item.created_at || '';
  const performance = item.performance || {};
  const perfKeys = performance && Object.keys(performance).length > 0;

  const detailId = 'detail-' + type + '-' + idx;

  let rowsHtml = configs.map(c =>
    '<tr><td>' + esc(c.category || c.cat || '') + '</td><td>' + esc(c.model || '') + '</td><td class="mct-price">¥' + ((c.price || 0)).toLocaleString() + '</td><td style="font-size:0.7rem;color:var(--text-dim);">' + esc(c.reason || '') + '</td></tr>'
  ).join('');

  let perfHtml = '';
  if (perfKeys) {
    const labels = { game: '游戏', prod: '生产力', cpu: 'CPU', storage: '存储', expand: '扩展', power: '功耗' };
    perfHtml = '<div class="perf-bars" style="margin-top:10px;">' +
      Object.entries(performance).map(([k, v]) =>
        '<div class="perf-bar-item"><div class="pb-label">' + (labels[k] || k) + ' ' + v + '%</div><div class="pb-track"><div class="pb-fill" style="width:' + v + '%"></div></div></div>'
      ).join('') + '</div>';
  }

  let actionsHtml = '';
  if (type === 'fav') {
    actionsHtml = '<button class="btn-sm danger" onclick="event.stopPropagation(); removeFav(' + item.id + ')">取消收藏</button>';
  } else if (type === 'hist') {
    actionsHtml = '<button class="btn-sm gold" onclick="event.stopPropagation(); addToFavs(' + idx + ')">加入收藏</button>' +
                  '<button class="btn-sm danger" onclick="event.stopPropagation(); removeHist(' + item.id + ')">删除</button>';
  }

  return `
    <div class="config-card">
      <div class="cc-header" onclick="toggleDetail('${detailId}', this)">
        <div class="cc-summary">
          <span class="cc-s-item cc-s-budget">¥${budget.toLocaleString()}</span>
          <span class="cc-s-item cc-s-scene">${esc(scenario)}</span>
          <span class="cc-s-item cc-s-total">总价 ¥${total_price.toLocaleString()}</span>
          <span class="cc-s-item cc-s-time">${esc(time)}</span>
        </div>
        <div class="cc-actions">
          ${actionsHtml}
          <span class="cc-expand" id="arrow-${detailId}">▶</span>
        </div>
      </div>
      <div class="cc-detail" id="${detailId}">
        <table class="mini-config-table">
          <thead><tr><th>配件</th><th>型号</th><th>价格</th><th>理由</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        ${perfHtml}
      </div>
    </div>`;
}

// ==================== 卡片折叠 ====================
function toggleDetail(detailId, headerEl) {
  const detail = document.getElementById(detailId);
  const arrow = document.getElementById('arrow-' + detailId);
  if (detail && arrow) {
    detail.classList.toggle('show');
    arrow.classList.toggle('open');
  }
}

// ==================== 收藏操作 ====================
async function removeFav(id) {
  if (!confirm('确定取消收藏？')) return;
  try {
    await apiDelete('/api/favorites/' + id);
    loadFavorites();
  } catch (e) { alert('操作失败'); }
}

async function addToFavs(idx) {
  try {
    const data = await apiGet('/api/history');
    if (data.history && data.history[idx]) {
      const h = data.history[idx];
      await apiPost('/api/favorites', {
        config_data: {
          budget: h.budget,
          scenario: h.scenario,
          total_price: h.total_price,
          configs: h.configs || [],
        }
      });
      loadFavorites();
      alert('已加入收藏');
    }
  } catch (e) { alert('操作失败'); }
}

async function removeHist(id) {
  if (!confirm('确定删除这条历史记录？')) return;
  try {
    await apiDelete('/api/history/' + id);
    loadHistory();
  } catch (e) { alert('操作失败'); }
}

// ==================== 社区互动数据 ====================
function getLocalStore(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; }
}
function setLocalStore(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function loadCommunityData() {
  loadLikedPosts();
  loadFavPosts();
  loadMyComments();
}

// 点赞过的帖子
function loadLikedPosts() {
  const el = document.getElementById('subtab-likes');
  const posts = getLocalStore('pc_liked_posts');
  if (!posts.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-text">暂无点赞记录</div></div>';
    return;
  }
  el.innerHTML = posts.map((p, i) => `
    <div class="interact-item">
      <div class="ii-info">
        <div class="ii-title" onclick="window.open('community.html','_self')">${esc(p.title || '无标题')}</div>
        <div class="ii-meta">作者: ${esc(p.author || '匿名')} · ${esc(p.time || '')}</div>
      </div>
      <div class="ii-actions">
        <button class="btn-sm danger" onclick="removeLikedPost(${i})">取消点赞</button>
      </div>
    </div>`).join('');
}

function removeLikedPost(idx) {
  const posts = getLocalStore('pc_liked_posts');
  posts.splice(idx, 1);
  setLocalStore('pc_liked_posts', posts);
  loadLikedPosts();
}

// 收藏的帖子
function loadFavPosts() {
  const el = document.getElementById('subtab-postfavs');
  const posts = getLocalStore('pc_fav_posts');
  if (!posts.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-text">暂无收藏帖子</div></div>';
    return;
  }
  el.innerHTML = posts.map((p, i) => `
    <div class="interact-item">
      <div class="ii-info">
        <div class="ii-title" onclick="window.open('community.html','_self')">${esc(p.title || '无标题')}</div>
        <div class="ii-meta">作者: ${esc(p.author || '匿名')} · ${esc(p.time || '')}</div>
      </div>
      <div class="ii-actions">
        <button class="btn-sm danger" onclick="removeFavPost(${i})">取消收藏</button>
      </div>
    </div>`).join('');
}

function removeFavPost(idx) {
  const posts = getLocalStore('pc_fav_posts');
  posts.splice(idx, 1);
  setLocalStore('pc_fav_posts', posts);
  loadFavPosts();
}

// 我的评论
function loadMyComments() {
  const el = document.getElementById('subtab-comments');
  const comments = getLocalStore('pc_comments');
  if (!comments.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-text">暂无评论记录</div></div>';
    return;
  }
  el.innerHTML = comments.map((c, i) => `
    <div class="interact-item">
      <div class="ii-info">
        <div class="ii-title" onclick="window.open('community.html','_self')">${esc(c.postTitle || '无标题')}</div>
        <div class="ii-comment" id="commentText-${i}">${esc(c.content || '')}</div>
        <div class="edit-comment-area" id="editArea-${i}">
          <input type="text" id="editInput-${i}" value="${esc(c.content || '')}" maxlength="500">
          <button class="btn-sm" onclick="saveEditComment(${i})">保存</button>
          <button class="btn-sm" onclick="cancelEditComment(${i})">取消</button>
        </div>
        <div class="ii-meta">${esc(c.time || '')}</div>
      </div>
      <div class="ii-actions">
        <button class="btn-sm" onclick="startEditComment(${i})">编辑</button>
        <button class="btn-sm danger" onclick="deleteComment(${i})">删除</button>
      </div>
    </div>`).join('');
}

function startEditComment(idx) {
  document.getElementById('editArea-' + idx).classList.add('show');
  document.getElementById('commentText-' + idx).style.display = 'none';
}

function cancelEditComment(idx) {
  document.getElementById('editArea-' + idx).classList.remove('show');
  document.getElementById('commentText-' + idx).style.display = '';
}

function saveEditComment(idx) {
  const comments = getLocalStore('pc_comments');
  const newContent = document.getElementById('editInput-' + idx).value.trim();
  if (!newContent) { alert('评论不能为空'); return; }
  comments[idx].content = newContent;
  setLocalStore('pc_comments', comments);
  loadMyComments();
}

function deleteComment(idx) {
  if (!confirm('确定删除这条评论？')) return;
  const comments = getLocalStore('pc_comments');
  comments.splice(idx, 1);
  setLocalStore('pc_comments', comments);
  loadMyComments();
}

// ==================== 标签切换 ====================
function switchTab(tabId, btn) {
  document.querySelectorAll('#loggedInContent .tab-btn[data-tab]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#loggedInContent .tab-panel[id^="tab-"]').forEach(p => p.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
}

function switchSubTab(subtabId, btn) {
  document.querySelectorAll('#tab-community .tab-btn[data-subtab]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#tab-community .tab-panel[id^="subtab-"]').forEach(p => p.classList.remove('active'));
  document.getElementById(subtabId).classList.add('active');
}

// ==================== 登录弹窗 ====================
function showLoginModal() {
  document.getElementById('loginModal').classList.add('show');
  document.getElementById('modalError').textContent = '';
  document.getElementById('loginAccount').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('modalTitle').textContent = '🔑 登录 / 注册';
}

function hideLoginModal() {
  document.getElementById('loginModal').classList.remove('show');
}

async function doLogin() {
  const account = document.getElementById('loginAccount').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl = document.getElementById('modalError');

  if (!account || account.length < 3) { errEl.textContent = '账号长度需在 3-20 个字符之间'; return; }
  if (!password || password.length < 6) { errEl.textContent = '密码长度至少 6 个字符'; return; }

  try {
    const resp = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account, password })
    });
    const data = await resp.json();
    if (resp.ok && data.success) {
      saveAuth(data.token, data.user);
      currentUser = data.user;
      hideLoginModal();
      loadProfile();
    } else {
      errEl.textContent = data.detail || '登录失败';
    }
  } catch (e) {
    errEl.textContent = '网络错误，请确认后端已启动';
  }
}

async function doRegister() {
  const account = document.getElementById('loginAccount').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl = document.getElementById('modalError');

  if (!account || account.length < 3) { errEl.textContent = '账号长度需在 3-20 个字符之间'; return; }
  if (!password || password.length < 6) { errEl.textContent = '密码长度至少 6 个字符'; return; }

  try {
    const resp = await fetch(API_BASE + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account, password })
    });
    const data = await resp.json();
    if ((resp.ok || resp.status === 200) && data.success) {
      saveAuth(data.token, data.user);
      currentUser = data.user;
      hideLoginModal();
      loadProfile();
    } else {
      errEl.textContent = data.detail || '注册失败';
    }
  } catch (e) {
    errEl.textContent = '网络错误，请确认后端已启动';
  }
}

// 点击遮罩关闭
document.getElementById('loginModal').addEventListener('click', function(e) {
  if (e.target === this) hideLoginModal();
});

// ==================== 工具函数 ====================
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ============ 波浪动画 (JS rAF 驱动，无缝循环) ============
(function(){
  var waves = document.querySelectorAll('.bg-waves');
  var speeds = [1/12, -1/14, 1/10];
  function step(ts){
    waves.forEach(function(el,i){
      var dur = Math.abs(speeds[i]) * 1000 * 1000;
      var raw = (ts % dur) / dur;
      if (speeds[i] < 0) raw = 1 - raw;
      el.style.transform = 'translateX(' + (-raw * 50) + '%)';
    });
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();

// ==================== 粒子系统 ====================
(function(){
  var c = document.getElementById('particlesContainer');
  if (!c) return;
  var colors = ['#00FFA3','#00C870','#7B2FFD','#9B59B6','#5B21B6'];
  var vw=window.innerWidth, vh=window.innerHeight;
  var xMin=vw*0.35, xMax=vw*0.65, yMin=vh*0.25, yMax=vh*0.65;
  function spawn(){
    var p=document.createElement('span');
    p.className='bg-particle';
    var s=2+Math.random()*3, d=5+Math.random()*4;
    p.style.cssText='left:'+(xMin+Math.random()*(xMax-xMin))+'px;top:'+(yMin+Math.random()*(yMax-yMin))+'px;width:'+s+'px;height:'+s+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';color:'+colors[Math.floor(Math.random()*colors.length)]+';animation-duration:'+d+'s;';
    c.appendChild(p);
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, d*1000+200);
  }
  for (var i=0;i<12;i++) setTimeout(function(){ spawn(); }, i*400);
  setInterval(function(){ spawn(); }, 600+Math.random()*300);
})();

// ==================== 启动 ====================
init();
</script>
